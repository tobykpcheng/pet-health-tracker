openapi: 3.0.3
info:
  title: Pet Health Record Manager API
  description: REST API for managing pet profiles and health records.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local Spring Boot server

paths:
  /pets:
    get:
      summary: List all pets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

    post:
      summary: Create a new pet
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get a pet by id
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

    put:
      summary: Update an existing pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

    delete:
      summary: Delete a pet
      responses:
        '204':
          description: Pet deleted successfully
        '404':
          description: Pet not found

components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          example: Maru
        species:
          type: string
          example: Dog
        breed:
          type: string
          example: Maltipoo
        birthDate:
          type: string
          format: date
          example: "2022-11-12"
        ageYears:
          type: integer
          readOnly: true
          example: 3
        ageMonths:
          type: integer
          readOnly: true
          example: 9
        weight:
          type: number
          format: double
          example: 10.5
