spring.application.name=backend

# Your database password lives in application-local.properties (not committed).
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:file:./application-local.properties

# SQL Server: database and login from the README "Local setup" section
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pet_health_tracker;encrypt=true;trustServerCertificate=true
spring.datasource.username=pethealth_app
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
